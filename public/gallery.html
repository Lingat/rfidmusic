<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Gallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #121212;
      }
      .gallery-container {
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        grid-gap: 8px;
      }

      .gallery-item {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        cursor: pointer;
        border-radius: 8px;
        transition: transform 0.1s ease;
      }

      .gallery-item:hover {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .gallery-item img,
      .gallery-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Overlay for items without images (like your video files) */
      .video-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: linear-gradient(45deg, #4285f4, #34a853);
        color: white;
        text-align: center;
        padding: 10px;
      }

      .item-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        color: white;
        font-size: 0.8rem;
        pointer-events: none;
      }

      .back-btn {
        margin: 20px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <button
      class="btn btn-outline-light back-btn"
      onclick="window.history.back()"
    >
      <i class="bi bi-arrow-left"></i> Back
    </button>

    <div class="gallery-container" id="gallery"></div>

    <script>
      async function loadGallery() {
        // Replace with your actual path to the JSON file
        const response = await fetch("./assets/tagToMusicMap.json");
        const data = await response.json();
        const gallery = document.getElementById("gallery");

        Object.keys(data).forEach((key) => {
          const item = data[key];
          const div = document.createElement("div");
          div.className = "gallery-item";
          div.onclick = function () {
            // This allows index.html to know which song to load
            window.location.href = `index.html?id=${key}`;
          };
          // Logic to handle missing images (common in your video entries)
          let mediaHtml = "";
          if (item.imageSrc && item.imageSrc !== "") {
            mediaHtml = `<img src="${item.imageSrc}" alt="${item.name}">`;
          } else if (item.src.endsWith(".mp4") || item.src.endsWith(".MOV")) {
            mediaHtml = `
                        <img src="${item.videoImageSrc}" alt="${item.name}">`;
          } else {
            mediaHtml = `
                        <div class="video-placeholder">
                            <i class="bi bi-play-circle-fill" style="font-size: 2rem;"></i>
                            <div style="font-weight: bold; margin-top:5px;">${item.name}</div>
                        </div>`;
          }

          div.innerHTML = `
                    ${mediaHtml}
                    <div class="item-info">
                        <strong>${item.name}</strong><br>${item.artist}
                    </div>
                `;

          gallery.appendChild(div);
        });
      }

      loadGallery();
    </script>
  </body>
</html>
