<html>
  <head>
    <title>Scan Music Player</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <style>
      * {
        text-align: center;
      }

      #rfidAudio {
        z-index: 100;
      }
      #songImage {
        width: 250px;
        height: 250px;
      }
      img {
        visibility: hidden;
        display: none;
      }
      img[src]:not([src=""]) {
        visibility: visible;
        display: initial;
      }
      video {
        visibility: hidden;
        display: none;
      }
      video[src]:not([src=""]) {
        visibility: visible;
        display: initial;
      }
      audio {
        visibility: hidden;
        display: none;
      }
      audio[src]:not([src=""]) {
        visibility: visible;
        display: initial;
      }
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #main {
        margin-top: -100px;
      }
      #main > * {
        margin: 20px;
      }
      #rfidVideo {
        height: 400px;
        width: 300px;
      }
    </style>
    <script src="index.js"></script>

    <div id="main">
      <h1>Scan an RFID tag here...</h1>
      <h2 id="songTitle">No song loaded</h2>
      <img id="songImage" src="" />
      <video id="rfidVideo" controls style="position: relative; z-index: 10000">
        Your browser does not support the video element.
      </video>

      <h3 id="songArtist">No artist to show</h3>
      <audio id="rfidAudio" controls style="position: relative; z-index: 10000">
        Your browser does not support the audio element.
      </audio>
    </div>

    <div>
      <input
        type="text"
        id="fullscreen-input"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          opacity: 0;
          z-index: 9999;
          cursor: default;
        "
      />
    </div>
  </body>
</html>
